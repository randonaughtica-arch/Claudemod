name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

env:
  # Run every JavaScript action on Node.js 24, including ones used inside the
  # Geode composite actions, instead of the deprecated Node.js 20
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate mod.json
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check mod.json against the sources
        run: node scripts/validate-mod.mjs

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

        - name: macOS
          os: macos-latest

        - name: iOS
          os: macos-latest
          target: iOS

        - name: Android32
          os: ubuntu-latest
          target: Android32

        - name: Android64
          os: ubuntu-latest
          target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

      # Job logs are only readable when signed in to GitHub, so rerun the
      # failed build and put its errors in the run's annotations instead
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          {
            cmake build
            cmake --build build --config Release -- -k 0
          } > build-log.txt 2>&1 || true
          # Skip the long compiler command lines so more errors fit
          ERRORS=$(grep -E -A3 "error:|error [A-Z]+[0-9]+:|CMake Error" build-log.txt | grep -v -e "-std=gnu++" | head -n 150)
          if [ -z "$ERRORS" ]; then
            ERRORS=$(tail -n 80 build-log.txt)
          fi
          ERRORS="${ERRORS//$'\r'/}"
          ERRORS="${ERRORS//'%'/'%25'}"
          ERRORS="${ERRORS//$'\n'/'%0A'}"
          echo "::error title=Build errors (${{ matrix.config.name }})::${ERRORS}"

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v7
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
